# Chronos-T5 baseline benchmark -- conda environment.
#
# Curated to the benchmark's real dependencies (the full `conda env export` dump
# was ~286 packages, mostly autogluon's transitive tree, which this benchmark
# does NOT import). Versions match the original `chronos_bench` env (Python 3.11).
#
# Create with:
#   conda env create -f environment.yml
#   conda activate chronos_bench
#
# IMPORTANT -- PyTorch is installed separately so you get the CUDA build for your
# GPU. After `conda activate chronos_bench`, run ONE of:
#   GPU (CUDA 12.8): pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cu128
#   CPU-only:        pip install torch==2.9.1
# (the pip block below intentionally omits torch; pick the right build above).
name: chronos_bench
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      # Core forecasting + data
      - chronos-forecasting==2.2.2
      - gluonts==0.16.2
      - datasets==4.0.0
      - transformers==4.57.6
      - accelerate==1.14.0
      # Numerics / IO
      - numpy==2.1.3
      - pandas==2.3.3
      - pyarrow==20.0.0
      - pyyaml==6.0.3
      # Notebook generation + execution
      - nbformat==5.10.4
      - nbconvert==7.17.1
      - ipykernel==7.3.0
      - matplotlib==3.10.9
