# Chronos-2 zero-shot study -- conda environment.
#
# Mirrors requirements.txt exactly (same pins, Python 3.11), in conda form, so the
# two dependency manifests stay in lock-step. The same `chronos-forecasting==2.2.2`
# wheel ships BOTH Chronos-T5 and Chronos-2, so no extra package is needed --
# Chronos-2 is loaded via `chronos.BaseChronosPipeline.from_pretrained("amazon/chronos-2")`.
#
# Create with:
#   conda env create -f environment.yml
#   conda activate chronos2
#
# (The sibling Chronos-T5 benchmark's `chronos_bench` env has identical deps, so you
# can reuse that instead of creating `chronos2` -- both work.)
#
# IMPORTANT -- PyTorch is installed separately so you get the CUDA build for your
# GPU. After `conda activate chronos2`, run ONE of:
#   GPU (CUDA 12.8): pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cu128
#   CPU-only:        pip install torch==2.9.1
# (the pip block below intentionally omits torch; pick the right build above).
name: chronos2
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      # Core forecasting + data
      - chronos-forecasting==2.2.2
      - gluonts==0.16.2
      - datasets==4.0.0
      - transformers==4.57.6
      - accelerate==1.14.0
      # Numerics / IO
      - numpy==2.1.3
      - pandas==2.3.3
      - pyarrow==20.0.0
      - pyyaml==6.0.3
      - scipy==1.16.3
      # Notebook generation + execution
      - nbformat==5.10.4
      - nbconvert==7.17.1
      - ipykernel==7.3.0
      - matplotlib==3.10.9
